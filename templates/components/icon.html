<svg class="mp-icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == "dashboard" %}
  <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect>
  <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect>
  <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect>
  <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect>
{% elif name == "progress" %}
  <rect x="4" y="12" width="4" height="8" rx="1"></rect>
  <rect x="10" y="7" width="4" height="13" rx="1"></rect>
  <rect x="16" y="3" width="4" height="17" rx="1"></rect>
{% elif name == "path" %}
  <circle cx="5" cy="18" r="2.25"></circle>
  <circle cx="12" cy="8" r="2.25"></circle>
  <circle cx="19" cy="15" r="2.25"></circle>
  <line x1="6.6" y1="16.4" x2="10.5" y2="9.8"></line>
  <line x1="13.6" y1="9.6" x2="17.5" y2="13.3"></line>
{% elif name == "classes" %}
  <path d="M3.5 6.5 L8 4 L12 6.5 L16 4 L20.5 6.5 V18 L16 20.5 L12 18 L8 20.5 L3.5 18 Z"></path>
  <line x1="8" y1="4" x2="8" y2="20.5"></line>
  <line x1="16" y1="4" x2="16" y2="20.5"></line>
{% elif name == "profile" %}
  <circle cx="12" cy="8" r="3.75"></circle>
  <path d="M4.5 20 L6.5 14.5 H17.5 L19.5 20"></path>
{% elif name == "star" %}
  <polygon points="12 3.5 14.4 9.6 21 10.1 15.9 14.3 17.6 20.7 12 17.1 6.4 20.7 8.1 14.3 3 10.1 9.6 9.6"></polygon>
{% elif name == "calendar" %}
  <rect x="3.5" y="5" width="17" height="15.5" rx="1.5"></rect>
  <line x1="3.5" y1="10" x2="20.5" y2="10"></line>
  <line x1="7.5" y1="3" x2="7.5" y2="7"></line>
  <line x1="16.5" y1="3" x2="16.5" y2="7"></line>
{% elif name == "document" %}
  <path d="M6 3.5 H14.5 L18.5 7.5 V20.5 H6 Z"></path>
  <line x1="14.5" y1="3.5" x2="14.5" y2="7.5"></line>
  <line x1="14.5" y1="7.5" x2="18.5" y2="7.5"></line>
  <line x1="9" y1="12.5" x2="15.5" y2="12.5"></line>
  <line x1="9" y1="16" x2="15.5" y2="16"></line>
{% elif name == "screen" %}
  <rect x="3.5" y="5" width="17" height="12" rx="1.5"></rect>
  <line x1="8.5" y1="20.5" x2="15.5" y2="20.5"></line>
  <line x1="12" y1="17" x2="12" y2="20.5"></line>
{% elif name == "help" %}
  <circle cx="12" cy="12" r="8.5"></circle>
  <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" stroke="none" fill="currentColor">?</text>
{% elif name == "logout" %}
  <path d="M10.5 3.5 H5 V20.5 H10.5"></path>
  <line x1="9.5" y1="12" x2="20.5" y2="12"></line>
  <polyline points="16.5 8 20.5 12 16.5 16"></polyline>
{% elif name == "play" %}
  <polygon points="6 4 20 12 6 20"></polygon>
{% elif name == "menu" %}
  <line x1="3.5" y1="6.5" x2="20.5" y2="6.5"></line>
  <line x1="3.5" y1="12" x2="20.5" y2="12"></line>
  <line x1="3.5" y1="17.5" x2="20.5" y2="17.5"></line>
{% elif name == "arrow-right" %}
  <line x1="4" y1="12" x2="19" y2="12"></line>
  <polyline points="13 6 19 12 13 18"></polyline>
{% elif name == "chevron-right" %}
  <polyline points="9 5 16 12 9 19"></polyline>
{% elif name == "mail" %}
  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
  <path d="M4 6.5 L12 13 L20 6.5"></path>
{% elif name == "lock" %}
  <rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect>
  <path d="M8 10.5 V7.5 a4 4 0 0 1 8 0 V10.5"></path>
{% elif name == "eye" %}
  <path d="M2.5 12 C5 7 9 5 12 5 C15 5 19 7 21.5 12 C19 17 15 19 12 19 C9 19 5 17 2.5 12 Z"></path>
  <circle cx="12" cy="12" r="3"></circle>
{% elif name == "eye-off" %}
  <path d="M6.2 6.9 C4.4 8.2 3 10 2.5 12 C5 17 9 19 12 19 C13.2 19 14.4 18.7 15.5 18.1"></path>
  <path d="M10.6 5.2 C11 5.1 11.5 5 12 5 C15 5 19 7 21.5 12 C20.8 13.4 20 14.6 19 15.6"></path>
  <path d="M9.5 10 a3 3 0 0 0 4.2 4.2"></path>
  <line x1="3" y1="3" x2="21" y2="21"></line>
{% elif name == "graduation-cap" %}
  <path d="M12 4 L22 9 L12 14 L2 9 Z"></path>
  <path d="M6 11 V16 C6 17.5 8.7 19 12 19 C15.3 19 18 17.5 18 16 V11"></path>
  <path d="M22 9 V15"></path>
{% elif name == "alert" %}
  <path d="M12 4 L21 19.5 H3 Z"></path>
  <line x1="12" y1="10" x2="12" y2="14"></line>
  <line x1="12" y1="16.8" x2="12" y2="16.9"></line>
{% elif name == "people" %}
  <circle cx="9" cy="8" r="3"></circle>
  <path d="M3.5 19 C3.5 15.5 6 13.5 9 13.5 C12 13.5 14.5 15.5 14.5 19"></path>
  <circle cx="17.5" cy="7" r="2.3"></circle>
  <path d="M15 12.1 C15.8 11.7 16.7 11.5 17.5 11.5 C19.8 11.5 21.3 13.3 21.3 15.7"></path>
{% elif name == "arrow-left" %}
  <line x1="20" y1="12" x2="5" y2="12"></line>
  <polyline points="11 6 5 12 11 18"></polyline>
{% elif name == "check" %}
  <polyline points="5 12.5 9.5 17 19 6.5"></polyline>
{% elif name == "check-circle" %}
  <circle cx="12" cy="12" r="9"></circle>
  <polyline points="8 12.5 11 15.5 16 9"></polyline>
{% elif name == "x-circle" %}
  <circle cx="12" cy="12" r="9"></circle>
  <line x1="9" y1="9" x2="15" y2="15"></line>
  <line x1="15" y1="9" x2="9" y2="15"></line>
{% elif name == "reset" %}
  <path d="M4.5 12 a7.5 7.5 0 1 1 2.4 5.5"></path>
  <polyline points="4.5 8 4.5 12 8.5 12"></polyline>
  <rect x="9" y="11" width="6.5" height="5.5" rx="1.2"></rect>
  <path d="M10.6 11 V9.4 a1.65 1.65 0 0 1 3.3 0 V11"></path>
{% elif name == "trash" %}
  <polyline points="4.5 6.5 19.5 6.5"></polyline>
  <path d="M9.5 6.5 V4.9 a1.4 1.4 0 0 1 1.4-1.4 h2.2 a1.4 1.4 0 0 1 1.4 1.4 V6.5"></path>
  <path d="M6.6 6.5 L7.5 19.4 a1.6 1.6 0 0 0 1.6 1.5 h5.8 a1.6 1.6 0 0 0 1.6-1.5 L17.4 6.5"></path>
  <line x1="10.4" y1="10.4" x2="10.4" y2="17"></line>
  <line x1="13.6" y1="10.4" x2="13.6" y2="17"></line>
{% elif name == "filter" %}
  <path d="M4 5 H20 L14 12.5 V18.5 L10 20.5 V12.5 Z"></path>
{% elif name == "chevron-down" %}
  <polyline points="5 9 12 16 19 9"></polyline>
{% elif name == "refresh" %}
  <path d="M4.5 12 a7.5 7.5 0 1 1 2.4 5.5"></path>
  <polyline points="4.5 8 4.5 12 8.5 12"></polyline>
{% elif name == "book" %}
  <path d="M3 5.2 C6 4.2 9.3 4.4 12 6 C14.7 4.4 18 4.2 21 5.2 V18.4 C18 17.4 14.7 17.6 12 19.2 C9.3 17.6 6 17.4 3 18.4 Z"></path>
  <line x1="12" y1="6" x2="12" y2="19.2"></line>
{% elif name == "trend" %}
  <polyline points="3.5,17 9.5,10.5 13,14 20.5,6.5"></polyline>
  <polyline points="15,6.5 20.5,6.5 20.5,12"></polyline>
{% elif name == "award" %}
  <circle cx="12" cy="9" r="5.5"></circle>
  <polygon points="12 6 12.9 7.9 15 8.2 13.5 9.7 13.9 11.8 12 10.8 10.1 11.8 10.5 9.7 9 8.2 11.1 7.9"></polygon>
  <path d="M8.6 13.6 L7.2 21 L12 18.4 L16.8 21 L15.4 13.6"></path>
{% elif name == "lightbulb" %}

  <path d="M12 8.5 a4.3 4.3 0 0 1 2.61 7.76 c-.46.31-.69.84-.69 1.38 v.23 h-3.84 v-.23 c0-.54-.23-1.08-.69-1.38 A4.3 4.3 0 0 1 12 8.5 z"></path>
  <line x1="10.15" y1="19.8" x2="13.85" y2="19.8"></line>
  <line x1="10.92" y1="21.6" x2="13.08" y2="21.6"></line>
  <line x1="12" y1="2.7" x2="12" y2="4.7"></line>
  <line x1="4.72" y1="5.72" x2="6.13" y2="7.13"></line>
  <line x1="19.28" y1="5.72" x2="17.87" y2="7.13"></line>
  <line x1="1.7" y1="13" x2="3.7" y2="13"></line>
  <line x1="22.3" y1="13" x2="20.3" y2="13"></line>
{% elif name == "gear" %}
  <circle cx="12" cy="12" r="3"></circle>
  <path d="M12 3.5 V6 M12 18 V20.5 M20.5 12 H18 M6 12 H3.5 M18.02 5.98 L16.2 7.8 M7.8 16.2 L5.98 18.02 M18.02 18.02 L16.2 16.2 M7.8 7.8 L5.98 5.98"></path>
{% elif name == "copy" %}
  <rect x="8.5" y="8.5" width="12" height="12" rx="1.5"></rect>
  <path d="M15.5 8.5 V5.5 a1.5 1.5 0 0 0 -1.5 -1.5 H5.5 a1.5 1.5 0 0 0 -1.5 1.5 V14.5 a1.5 1.5 0 0 0 1.5 1.5 H8.5"></path>
{% elif name == "expand" %}
  <polyline points="9 4 4 4 4 9"></polyline>
  <polyline points="15 4 20 4 20 9"></polyline>
  <polyline points="9 20 4 20 4 15"></polyline>
  <polyline points="15 20 20 20 20 15"></polyline>
{% elif name == "collapse" %}
  <polyline points="4 9 9 9 9 4"></polyline>
  <polyline points="20 9 15 9 15 4"></polyline>
  <polyline points="4 15 9 15 9 20"></polyline>
  <polyline points="20 15 15 15 15 20"></polyline>
{% elif name == "keyboard" %}
  <rect x="2.5" y="6" width="19" height="12" rx="2"></rect>
  <line x1="6" y1="9.8" x2="6" y2="9.8"></line>
  <line x1="9" y1="9.8" x2="9" y2="9.8"></line>
  <line x1="12" y1="9.8" x2="12" y2="9.8"></line>
  <line x1="15" y1="9.8" x2="15" y2="9.8"></line>
  <line x1="18" y1="9.8" x2="18" y2="9.8"></line>
  <line x1="7.5" y1="12.6" x2="7.5" y2="12.6"></line>
  <line x1="10.5" y1="12.6" x2="10.5" y2="12.6"></line>
  <line x1="13.5" y1="12.6" x2="13.5" y2="12.6"></line>
  <line x1="16.5" y1="12.6" x2="16.5" y2="12.6"></line>
  <line x1="8" y1="15.2" x2="16" y2="15.2"></line>
{% endif %}
</svg>
