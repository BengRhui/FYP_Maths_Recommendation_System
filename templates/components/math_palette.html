
<div class="math-palette" id="mathPalette" data-math-palette-panel hidden>
  <div class="math-palette-tabs" role="tablist" aria-label="Symbol groups">
    <button type="button" class="math-palette-tab is-active" data-palette-tab="basic"
            role="tab" aria-selected="true">Basic</button>
    <button type="button" class="math-palette-tab" data-palette-tab="functions"
            role="tab" aria-selected="false">Functions</button>
    <button type="button" class="math-palette-tab" data-palette-tab="symbols"
            role="tab" aria-selected="false">Symbols</button>
  </div>

  <div class="math-palette-grid" data-palette-group="basic">
    <button type="button" data-insert="+" data-cursor-offset="1" data-latex="+">+</button>
    <button type="button" data-insert="-" data-cursor-offset="1" data-latex="-">−</button>
    <button type="button" data-insert="*" data-cursor-offset="1" data-latex="\times">×</button>
    <button type="button" data-insert="/" data-cursor-offset="1" data-latex="\div">÷</button>
    <button type="button" data-insert="=" data-cursor-offset="1" data-latex="=">=</button>
    <button type="button" data-insert="()/()" data-cursor-offset="1" data-latex="\frac{x}{y}">x/y</button>
    <button type="button" data-insert="sqrt()" data-cursor-offset="5" data-latex="\sqrt{x}">√x</button>
    <button type="button" data-insert="^(2)" data-cursor-offset="4" data-latex="x^2">x²</button>
    <button type="button" data-insert="^()" data-cursor-offset="2" data-latex="x^y">xʸ</button>
  </div>

  <div class="math-palette-grid" data-palette-group="functions" hidden>
    <button type="button" data-insert="log()" data-cursor-offset="4" data-latex="\log">log</button>
    <button type="button" data-insert="log_()()" data-cursor-offset="5" data-latex="\log_b">log_b</button>
    <button type="button" data-insert="ln()" data-cursor-offset="3" data-latex="\ln">ln</button>
    <button type="button" data-insert="sin()" data-cursor-offset="4" data-latex="\sin">sin</button>
    <button type="button" data-insert="cos()" data-cursor-offset="4" data-latex="\cos">cos</button>
    <button type="button" data-insert="tan()" data-cursor-offset="4" data-latex="\tan">tan</button>
  </div>

  <div class="math-palette-grid" data-palette-group="symbols" hidden>
    <button type="button" data-insert="()" data-cursor-offset="1" data-latex="(\,)">( )</button>
    <button type="button" data-insert="pi" data-cursor-offset="2" data-latex="\pi">π</button>
    <button type="button" data-insert="&lt;=" data-cursor-offset="2" data-latex="\leq">≤</button>
    <button type="button" data-insert="&gt;=" data-cursor-offset="2" data-latex="\geq">≥</button>
    <button type="button" data-insert="!=" data-cursor-offset="2" data-latex="\neq">≠</button>
  </div>
</div>
